services:
  # ----------------------------------------------------
  # 1. TuneSense Backend Web Service (FastAPI + ML Engine)
  # ----------------------------------------------------
  - type: web
    name: tunesense-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_NAME
        value: tunesense
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        value: https://tunesense-frontend.onrender.com,http://localhost:5173

  # ----------------------------------------------------
  # 2. TuneSense Frontend Static Site (React + Vite SPA)
  # ----------------------------------------------------
  - type: web
    name: tunesense-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://tunesense-backend.onrender.com
